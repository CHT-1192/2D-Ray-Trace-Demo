<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101114'/%3E%3Cpath d='M16 16 L32 2 L32 14 Z' fill='%23ffcf7a' fill-opacity='.55'/%3E%3Cpath d='M16 16 L2 30 L2 20 Z' fill='%23ffcf7a' fill-opacity='.3'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23fff'/%3E%3C/svg%3E"
    />
    <title>2D 光线追踪 Demo · 精确边缘锁定</title>
    <meta
      name="description"
      content="2D 点光源硬阴影 Demo：角点角度精确锁定阴影边界，每个角区间只投 1 条射线而不是扫 360 条。WebGL2 渲染，方块程序化生成、自左向右平移。"
    />
    <style>
:root {
  --accent: #ffcf7a;
  --accent-dim: #8a6f3c;
  --text: #e8e9ec;
  --dim: #8d919b;
  --panel: rgba(15, 16, 19, 0.74);
  --line: rgba(255, 255, 255, 0.09);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #101114;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

#stage {
  position: fixed;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#ui.hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  transition: opacity 0.18s ease;
}

#ui.hud.hidden {
  opacity: 0;
}

#ui.hud.hidden .panel,
#ui.hud.hidden .hint {
  pointer-events: none;
}

.panel {
  position: absolute;
  top: 18px;
  left: 18px;
  width: 274px;
  padding: 14px 14px 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--panel);
  backdrop-filter: blur(16px) saturate(1.3);
  -webkit-backdrop-filter: blur(16px) saturate(1.3);
  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
  pointer-events: auto;
  user-select: none;
}

.panel header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.panel h1 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.badge {
  flex: 0 0 auto;
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 2px 7px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--dim);
}

.sub {
  margin: 6px 0 12px;
  font-size: 11px;
  line-height: 1.5;
  color: var(--dim);
}

.modes {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.03);
}

.modes button {
  padding: 6px 2px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--dim);
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}

.modes button:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.06);
}

.modes button.active {
  background: var(--accent);
  color: #211a08;
  font-weight: 600;
}

.note {
  min-height: 44px;
  margin: 8px 2px 10px;
  font-size: 10.5px;
  line-height: 1.5;
  color: #a9adb6;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px 6px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(0, 0, 0, 0.22);
}

.stats div {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  cursor: help;
}

.stats span {
  font-size: 9.5px;
  color: var(--dim);
}

.stats b {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--accent);
  white-space: nowrap;
}

.row {
  display: grid;
  grid-template-columns: 40px 1fr 42px;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  font-size: 11px;
  color: var(--dim);
}

.row.dim {
  opacity: 0.35;
}

.row b {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text);
  text-align: right;
}

.row-seed {
  grid-template-columns: 40px 1fr auto;
}

.row input[type="number"] {
  width: 100%;
  padding: 3px 6px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.3);
  color: var(--text);
  font-family: var(--mono);
  font-size: 11px;
}

.row input[type="number"]:focus {
  outline: none;
  border-color: rgba(255, 207, 122, 0.5);
}

.row button.dice {
  padding: 4px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
  font-family: inherit;
  font-size: 10.5px;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.row button.dice:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 207, 122, 0.4);
}

.tip {
  margin: 8px 2px 0;
  font-size: 10px;
  line-height: 1.5;
  color: #7e828b;
}

.row select {
  grid-column: 2 / span 2;
  width: 100%;
  padding: 3px 6px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.3);
  color: var(--text);
  font-family: var(--mono);
  font-size: 11px;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 3px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.14);
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  box-shadow: 0 0 0 3px rgba(255, 207, 122, 0.16);
}

.flags {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 8px;
  margin-top: 12px;
}

.flags label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  color: var(--dim);
  cursor: pointer;
}

.flags input {
  accent-color: var(--accent);
  width: 12px;
  height: 12px;
  margin: 0;
}

.hint {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  font-size: 10.5px;
  color: var(--dim);
  white-space: nowrap;
}

kbd {
  display: inline-block;
  min-width: 15px;
  padding: 1px 4px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.05);
  font-family: var(--mono);
  font-size: 9.5px;
  color: #c9ccd3;
  text-align: center;
}

@media (max-width: 760px) {
  .panel {
    top: 10px;
    left: 10px;
    right: 10px;
    width: auto;
    max-height: 62vh;
    overflow-y: auto;
  }

  .hint {
    display: none;
  }
}
</style>
  </head>

<div class="panel">
  <header>
    <h1>2D 光线追踪</h1>
    <span class="badge" data-backend>—</span>
  </header>
  <p class="sub">点光源硬阴影 · 方块程序化生成，自左向右平移</p>

  <div class="modes">
    <button type="button" data-mode="exact">精确锁定边缘</button>
    <button type="button" data-mode="edge">角点 ±ε</button>
    <button type="button" data-mode="uniform">均匀射线</button>
  </div>
  <p class="note" data-note></p>

  <div class="stats">
    <div title="本帧参与求交的线段：每个方块 4 条 + 4 面外墙">
      <span>线段</span><b data-stat="segments">0</b>
    </div>
    <div title="本帧实际投射的射线数。精确模式 = 角区间数，而不是固定 360 条">
      <span>射线</span><b data-stat="rays">0</b>
    </div>
    <div title="可见多边形的顶点数，与角点数量同阶">
      <span>顶点</span><b data-stat="vertices">0</b>
    </div>
    <div title="同屏可见的方块数（屏幕外的邻居不参与求交）">
      <span>方块</span><b data-stat="blocks">0</b>
    </div>
    <div title="可见性求解耗时：角度排序 + 射线求交">
      <span>求解</span><b data-stat="vis">0</b>
    </div>
    <div title="真实帧率（受 vsync 限制）">
      <span>FPS</span><b data-stat="fps">0</b>
    </div>
  </div>

  <label class="row">
    <span>速度</span>
    <input type="range" min="0" max="400" step="5" data-slider="speed">
    <b data-value="speed">0</b>
  </label>
  <label class="row" data-row="rayCount">
    <span>射线数</span>
    <input type="range" min="90" max="1440" step="30" data-slider="rayCount">
    <b data-value="rayCount">0</b>
  </label>
  <label class="row" data-row="epsilon">
    <span>ε / rad</span>
    <select data-select="epsilon"></select>
  </label>

  <label class="row row-seed">
    <span>种子</span>
    <input type="number" data-seed min="0" max="2147483647" step="1" spellcheck="false" />
    <button type="button" class="dice" data-action="dice" title="换一个随机种子">随机</button>
  </label>
  <p class="tip">同一颗种子永远生成同一个世界。种子会写进地址栏，刷新或分享链接都能复现。</p>

  <div class="flags">
    <label><input type="checkbox" data-flag="debugRays"><span>显示射线</span></label>
    <label><input type="checkbox" data-flag="followMouse"><span>光源跟随鼠标</span></label>
    <label><input type="checkbox" data-flag="showBlocks"><span>显示方块</span></label>
    <label><input type="checkbox" data-flag="paused"><span>暂停滚动</span></label>
  </div>

</div>

</div>
